[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-first-tool-router"
version = "0.1.0"
description = "Three-tier evidence-first tool routing for Strands Decider 2B + Amazon Bedrock. Standard library only."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
